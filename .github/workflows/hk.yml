name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
      - run: uv sync
      - run: uv run pytest
      - uses: hugoh/gh-workflows/hk-check@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
