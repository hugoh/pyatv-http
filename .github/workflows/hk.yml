name: hk

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: hugoh/gh-workflows/setup@20f042d18e1e5318722f808bafc6d7fc18a838f7  # v1.40.17
      - run: uv sync
      - run: uv run pytest
      - uses: hugoh/gh-workflows/hk-check@20f042d18e1e5318722f808bafc6d7fc18a838f7  # v1.40.17
