name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@7e1836747c24d88f02af41710dd3e5bd95429afd # v1.40.9
      - run: uv sync
      - run: uv run pytest
      - uses: hugoh/gh-workflows/hk-check@7e1836747c24d88f02af41710dd3e5bd95429afd # v1.40.9
