name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@bbbf25812da61dd48510494ce8d6c55e6f919aa6 # v1.40.13
      - run: uv sync
      - run: uv run pytest
      - uses: hugoh/gh-workflows/hk-check@bbbf25812da61dd48510494ce8d6c55e6f919aa6 # v1.40.13
