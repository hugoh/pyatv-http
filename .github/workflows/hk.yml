name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@5e3ffc337ef532df4ff618c5d2844a09b254eaee # v1.40.10
      - run: uv sync
      - run: uv run pytest
      - uses: hugoh/gh-workflows/hk-check@5e3ffc337ef532df4ff618c5d2844a09b254eaee # v1.40.10
